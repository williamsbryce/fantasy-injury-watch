name: Diagnose MFL player news page (temporary)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-mfl-news.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Examine public MFL news page format without API credentials
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.error
          from html import unescape
          url="https://www.myfantasyleague.com/2026/news_articles?L=40298&PLAYERS=14836"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; FantasyInjuryWatchBryce/1.0)","Accept":"text/html"})
          try:
            with urllib.request.urlopen(req,timeout=25) as r:
              raw=r.read(1000000).decode("utf-8","replace")
              print("HTTP:",r.status,"Type:",r.headers.get("Content-Type"),"HTML characters:",len(raw))
              print("Final host:",urllib.parse.urlsplit(r.url).hostname)
          except urllib.error.HTTPError as e:
            print("HTTP:",e.code,"Content-Type:",e.headers.get("Content-Type"));raise
          except Exception as e:
            print("Network error:",type(e).__name__);raise
          safe=re.sub(r"(?is)<script\b[^>]*>.*?</script>","",raw)
          safe=re.sub(r"(?is)<style\b[^>]*>.*?</style>","",safe)
          for key in ["news_articles", "practice", "injury", "report", "article", "news","roto"]:
            print("Count",key,len(re.findall(key,safe,re.I)))
          safe=re.sub(r"(?is)(href|src)=[\"'][^\"']{0,1000}[\"']",r"\1=[URL]",safe)
          print("FIRST_HTML:",safe[:4500].replace("\n"," "))
          PY
      - name: Examine public NFL RSS news feed
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          url="https://www.rotowire.com/rss/news.php?sport=NFL"
          request=urllib.request.Request(url,headers={"User-Agent":"FantasyInjuryWatchBryce/1.0","Accept":"application/rss+xml, application/xml"})
          with urllib.request.urlopen(request,timeout=25) as response:
              data=response.read(2000000)
              print("RSS HTTP status",response.status,"bytes",len(data))
          root=ET.fromstring(data)
          items=root.findall(".//item")
          print("RSS item count",len(items))
          for x in items[:4]:
              print("RSS TITLE:",(x.findtext("title") or "")[:130])
              print("RSS DATE:",(x.findtext("pubDate") or "")[:100])
              print("RSS LINK:",(x.findtext("link") or "")[:150])
              print("RSS DESCRIPTION CHARS:",len(x.findtext("description") or ""))
          PY
      - name: Examine public NFL news page HTML structure
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, re
          url="https://www.rotowire.com/football/news.php"
          request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; FantasyInjuryWatchBryce/1.0)","Accept":"text/html"})
          with urllib.request.urlopen(request,timeout=20) as response:
            html=response.read(1500000).decode("utf-8","replace")
            print("News page HTTP:",response.status,"bytes",len(html))
          for word in ("josh jacobs","news-update__player-link","Could be back for Week 12"):
            found=re.search(re.escape(word),html,re.I)
            print("NEWS TAG",word,"found",bool(found))
            if found:
              snippet=html[max(0,found.start()-450):found.end()+950]
              snippet=re.sub(r"(?is)(href|src)=[\"'][^\"']+[\"']",r"\1=[URL]",snippet)
              print("NEWS HTML SAMPLE:",snippet[:1400].replace("\n"," "))
          PY
