name: Refresh MFL Lineup Roles (read-only)
on:
  workflow_dispatch:
  schedule:
    # Refresh lineup roles independently of the MFL injury export.
    - cron: '38 */3 * * *'
  push:
    branches:
      - main
    paths:
      - 'src/lineup_snapshot.py'
      - 'tests/test_lineup_snapshot.py'
      - 'src/mfl_article_headlines.py'
      - 'tests/test_mfl_article_headlines.py'
      - '.github/workflows/lineup-status.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lineup-status-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ vars.MFL_LEAGUE_ID != '' && vars.MFL_FRANCHISE_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out cached injury report
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Verify lineup snapshot safety tests
        run: |
          python -m unittest discover -s tests -p 'test_lineup_monitor.py' -v
          python -m unittest discover -s tests -p 'test_lineup_snapshot.py' -v
          python -m unittest discover -s tests -p 'test_mfl_article_headlines.py' -v
      - name: Read current-week lineup and tag cached injuries
        env:
          MFL_API_KEY: ${{ secrets.MFL_API_KEY }}
          MFL_LEAGUE_ID: ${{ vars.MFL_LEAGUE_ID }}
          MFL_FRANCHISE_ID: ${{ vars.MFL_FRANCHISE_ID }}
          MFL_SEASON: ${{ vars.MFL_SEASON }}
        run: python -m src.lineup_snapshot
      - name: Fetch latest MFL article headlines (optional and read-only)
        env:
          MFL_OWNER_USERNAME: ${{ secrets.MFL_OWNER_USERNAME }}
          MFL_OWNER_PASSWORD: ${{ secrets.MFL_OWNER_PASSWORD }}
          MFL_LEAGUE_ID: ${{ vars.MFL_LEAGUE_ID }}
          MFL_FRANCHISE_ID: ${{ vars.MFL_FRANCHISE_ID }}
          MFL_SEASON: ${{ vars.MFL_SEASON }}
        run: python -m src.mfl_article_headlines
      - name: Save lineup roles and headline titles without changing injury sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh lineup labels and MFL article titles [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: refresh
    if: ${{ needs.refresh.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out updated injury report
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Ensure published report exists
        run: test -s site/data/report.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload current dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Deploy public dashboard
        id: deployment
        uses: actions/deploy-pages@v4
