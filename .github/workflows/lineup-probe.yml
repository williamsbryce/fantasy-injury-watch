name: Live lineup probe (read-only)
on:
  workflow_dispatch:
    inputs:
      week:
        description: NFL week number
        required: true
        default: '12'
        type: string
  push:
    paths:
      - '.github/workflows/lineup-probe.yml'

permissions:
  contents: read

jobs:
  lineup-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run parser safety tests
        run: python -m unittest discover -s tests -v
      - name: Inspect submitted lineup (NEVER WRITE)
        env:
          MFL_API_KEY: ${{ secrets.MFL_API_KEY }}
          MFL_USER_ID: ${{ secrets.MFL_USER_ID }}
          MFL_LEAGUE_ID: ${{ vars.MFL_LEAGUE_ID }}
          MFL_FRANCHISE_ID: ${{ vars.MFL_FRANCHISE_ID }}
          MFL_SEASON: ${{ vars.MFL_SEASON }}
          MFL_WEEK: ${{ inputs.week || '12' }}
        run: python -m src.lineup_probe
