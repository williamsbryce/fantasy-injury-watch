name: Injury Watch (read-only)
on:
  push:
    branches: [main]
    paths:
      - "src/main.py"
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Send one test email using configured Resend settings"
        type: boolean
        default: false
        required: false
  schedule:
    # MFL sync every three hours, off the hour to reduce contention.
    - cron: '17 */3 * * *'
    # Extra evening checks around Thursday and Sunday game windows (UTC).
    - cron: '47 22,23 * * 0,4'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: injury-watch
  cancel-in-progress: false

jobs:
  sync:
    # Wait for repository variables; manual runs still explain any missing credentials.
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.MFL_LEAGUE_ID != '' && vars.MFL_FRANCHISE_ID != '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out code and previous encrypted report
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install --requirement requirements.txt
      - name: Check parser tests
        run: python -m unittest discover -s tests -v
      - name: Migrate last verified encrypted report to public format
        env:
          REPORT_PASSPHRASE: ${{ secrets.REPORT_PASSPHRASE }}
        run: python -m src.migrate
      - name: Sync MyFantasyLeague and write public report
        env:
          MFL_API_KEY: ${{ secrets.MFL_API_KEY }}
          MFL_CLIENT_NAME: ${{ vars.MFL_CLIENT_NAME }}
          MFL_LEAGUE_ID: ${{ vars.MFL_LEAGUE_ID }}
          MFL_FRANCHISE_ID: ${{ vars.MFL_FRANCHISE_ID }}
          MFL_LEAGUE_NAME: ${{ vars.MFL_LEAGUE_NAME }}
          MFL_SEASON: ${{ vars.MFL_SEASON }}
          REPORT_PASSPHRASE: ${{ secrets.REPORT_PASSPHRASE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SEND_TEST_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email || false }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          ALERT_TO: ${{ vars.ALERT_TO }}
        run: python -m src.main
      - name: Save report and remove obsolete encrypted copy
        if: ${{ always() }}
        run: |
          if ! test -s site/data/report.json; then
            echo "::warning::No public report available; nothing to publish."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/report.json
          git rm -f --ignore-unmatch site/data/report.enc.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public injury status [skip ci]'
            git push
          fi
  deploy:
    # Deploy the last verified public report even if the next MFL poll fails.
    # Never publish an empty/all-clear report when MFL is unavailable.
    needs: sync
    if: ${{ always() && (needs.sync.result == 'success' || needs.sync.result == 'failure') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out last saved public report
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Require an existing public report
        run: test -s site/data/report.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload encrypted Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Let Pages artifact metadata become available
        run: sleep 15
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
