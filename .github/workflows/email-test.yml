name: Email Test (Resend only)

on:
  push:
    branches: [main]
    paths:
      - 'src/notify.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test-email:
    runs-on: ubuntu-latest
    steps:
      - name: Check out email sender code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Send exactly one diagnostic message
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          ALERT_TO: ${{ vars.ALERT_TO }}
        run: python -m src.email_test
