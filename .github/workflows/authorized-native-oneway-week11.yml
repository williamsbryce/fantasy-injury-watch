name: Authorized Native MFL Week 11 One-Way Swap
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/authorized-native-oneway-week11.yml'

permissions:
  contents: read

concurrency:
  group: authorized-native-mfl-week11-once
  cancel-in-progress: false

jobs:
  submit-native-lineup-once:
    if: ${{ github.actor == 'williamsbryce' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact vetted development source
        uses: actions/checkout@v4
        with:
          ref: 3df1dbd649387488043801687c9dd28eb6b18738
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify browser-equivalent submission and owner safety offline
        run: |
          python -m unittest discover -s tests -p 'test_manual_lineup_test.py' -v
          python -m unittest discover -s tests -p 'test_submitted_lineup.py' -v
          python -m unittest discover -s tests -p 'test_reversible_lineup_test.py' -v
          python -m unittest discover -s tests -p 'test_native_mfl_lineup.py' -v
      - name: Post one native Week 11 lineup and verify Anthony Hill Jr starter
        env:
          MFL_OWNER_USERNAME: ${{ secrets.MFL_OWNER_USERNAME }}
          MFL_OWNER_PASSWORD: ${{ secrets.MFL_OWNER_PASSWORD }}
          MFL_API_KEY: ${{ secrets.MFL_API_KEY }}
          NATIVE_LINEUP_APPROVAL: APPROVED_ONE_WAY_NATIVE_CEDRIC_GRAY_TO_ANTHONY_HILL_W11
        run: python -m src.one_way_native_swap
