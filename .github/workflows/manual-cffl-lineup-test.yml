name: Manual CFFL lineup verification and swap
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'CHECK reads Week 12, DRY_RUN tests swap, LIVE submits once'
        required: true
        default: 'CHECK'
        type: choice
        options:
          - CHECK
          - DRY_RUN
          - LIVE
      outgoing_player_id:
        description: 'Exact current Week 12 starter MFL ID (needed for DRY_RUN/LIVE)'
        required: false
        type: string
      incoming_player_id:
        description: 'Exact Week 12 bench MFL ID (needed for DRY_RUN/LIVE)'
        required: false
        type: string
      approval:
        description: 'LIVE only: APPROVE <out-id> TO <in-id> WEEK 12'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-or-swap:
    if: ${{ github.actor == 'williamsbryce' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout guarded lineup code, never the public dashboard
        uses: actions/checkout@v4
        with:
          ref: feature/out-starter-guard
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify lineup write safety tests
        run: |
          python -m unittest discover -s tests -p 'test_submitted_lineup.py' -v
          python -m unittest discover -s tests -p 'test_manual_lineup_test.py' -v
      - name: CHECK current Week 12 starters (read only)
        if: ${{ inputs.mode == 'CHECK' }}
        env:
          MFL_OWNER_USERNAME: ${{ secrets.MFL_OWNER_USERNAME }}
          MFL_OWNER_PASSWORD: ${{ secrets.MFL_OWNER_PASSWORD }}
          MFL_API_KEY: ${{ secrets.MFL_API_KEY }}
          MFL_CLIENT_NAME: ${{ vars.MFL_CLIENT_NAME }}
          MFL_LEAGUE_ID: '40298'
          MFL_FRANCHISE_ID: '0001'
          MFL_SEASON: '2026'
          MFL_LINEUP_WEEK: '12'
        run: python -m src.live_lineup_dry_run
      - name: Execute explicitly approved one-time manual substitution
        if: ${{ inputs.mode == 'DRY_RUN' || inputs.mode == 'LIVE' }}
        env:
          MFL_OWNER_USERNAME: ${{ secrets.MFL_OWNER_USERNAME }}
          MFL_OWNER_PASSWORD: ${{ secrets.MFL_OWNER_PASSWORD }}
          MFL_LEAGUE_ID: '40298'
          MFL_FRANCHISE_ID: '0001'
          MFL_SEASON: '2026'
          TEST_LINEUP_WEEK: '12'
          TEST_OUT_PLAYER_ID: ${{ inputs.outgoing_player_id }}
          TEST_IN_PLAYER_ID: ${{ inputs.incoming_player_id }}
          TEST_SWAP_MODE: ${{ inputs.mode }}
          TEST_APPROVAL: ${{ inputs.approval }}
        run: python -m src.manual_lineup_test
