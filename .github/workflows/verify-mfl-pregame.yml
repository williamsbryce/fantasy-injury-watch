name: Verify real MFL pregame lineup data (read only)
on:
  pull_request:
    paths:
      - 'src/probe_mfl_lineups.py'
      - 'src/mfl_owner_auth.py'
      - '.github/workflows/verify-mfl-pregame.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostic code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify authenticated pregame Starting Lineups structure (no writes)
        env:
          MFL_OWNER_USERNAME: ${{ secrets.MFL_OWNER_USERNAME }}
          MFL_OWNER_PASSWORD: ${{ secrets.MFL_OWNER_PASSWORD }}
          MFL_LEAGUE_ID: ${{ vars.MFL_LEAGUE_ID }}
          MFL_FRANCHISE_ID: ${{ vars.MFL_FRANCHISE_ID }}
          MFL_SEASON: ${{ vars.MFL_SEASON }}
          MFL_LINEUP_WEEK: '12'
        run: python -m src.mfl_owner_auth
