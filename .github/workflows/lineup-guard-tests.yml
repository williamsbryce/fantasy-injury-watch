name: Read-only lineup guard tests
on:
  pull_request:
    paths:
      - 'src/lineup_guard.py'
      - 'tests/test_lineup_guard.py'
      - 'tests/test_mfl_owner_auth.py'
      - 'src/submitted_lineup.py'
      - 'tests/test_submitted_lineup.py'
      - 'src/lineup_replacements.py'
      - 'tests/test_lineup_replacements.py'
      - 'src/nfl_week.py'
      - 'tests/test_nfl_week.py'
      - 'src/manual_lineup_test.py'
      - 'src/reversible_lineup_test.py'
      - 'tests/test_reversible_lineup_test.py'
      - 'tests/test_manual_lineup_test.py'
      - 'src/one_way_lineup_test.py'
      - 'tests/test_one_way_lineup_test.py'
      - 'src/mfl_native_lineup.py'
      - 'src/one_way_native_swap.py'
      - 'tests/test_native_mfl_lineup.py'
      - 'src/auto_lineup_policy.py'
      - 'src/auto_lineup_schedule.py'
      - 'src/recent_scores.py'
      - 'src/auto_lineup_guard.py'
      - 'tests/test_auto_lineup_guard.py'
      - 'tests/test_auto_lineup_integration.py'
      - 'src/model.py'
      - 'src/probe_mfl_lineups.py'
      - '.github/workflows/lineup-guard-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated lineup tests (no MFL or Resend calls)
        run: |
          python -m unittest discover -s tests -p 'test_lineup_guard.py' -v
          python -m unittest discover -s tests -p 'test_mfl_owner_auth.py' -v
          python -m unittest discover -s tests -p 'test_submitted_lineup.py' -v
          python -m unittest discover -s tests -p 'test_lineup_replacements.py' -v
          python -m unittest discover -s tests -p 'test_nfl_week.py' -v
          python -m unittest discover -s tests -p 'test_manual_lineup_test.py' -v
          python -m unittest discover -s tests -p 'test_reversible_lineup_test.py' -v
          python -m unittest discover -s tests -p 'test_one_way_lineup_test.py' -v
          python -m unittest discover -s tests -p 'test_native_mfl_lineup.py' -v
          python -m unittest discover -s tests -p 'test_auto_lineup_guard.py' -v
          python -m unittest discover -s tests -p 'test_auto_lineup_integration.py' -v
      - name: Run read-only MFL export probe
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          MFL_API_KEY: ${{ secrets.MFL_API_KEY }}
          MFL_CLIENT_NAME: ${{ vars.MFL_CLIENT_NAME }}
          MFL_LEAGUE_ID: ${{ vars.MFL_LEAGUE_ID }}
          MFL_FRANCHISE_ID: ${{ vars.MFL_FRANCHISE_ID }}
          MFL_SEASON: ${{ vars.MFL_SEASON }}
        run: python -m src.probe_mfl_lineups
