name: Initialize Injury Watch Event History
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/initialize-event-history.yml'

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify audit history unit tests
        run: python -m unittest discover -s tests -p 'test_audit_log.py' -v
      - name: Save actual event-history activation
        env:
          AUDIT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from src.audit_log import record_event
          saved = record_event(
              "system", "info", "Event history activated",
              "Operational event tracking enabled. Future accepted emails and MFL lineup actions will appear here.",
              key="history-enabled")
          print("AUDIT INITIALIZATION:", "written" if saved else "already recorded")
          PY
