name: Official NFL Game-Day Availability
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/nfl_game_day.py'
      - 'src/pregame_news.py'
      - 'tests/test_nfl_game_day.py'
      - 'tests/test_pregame_news.py'
      - '.github/workflows/nfl-game-day.yml'
  schedule:
    # Sunday 7:00 AM onward Saskatchewan time (UTC-6).
    # NFL/RotoWire pregame news starts before official inactives (~90 min before kickoff).
    - cron: '3,18,33,48 13-23 * * 0'
    - cron: '3,18,33,48 0 * * 1'
    # Recovery checks during the Sunday night game.
    - cron: '17,47 1-3 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nfl-game-day-availability
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ vars.MFL_LEAGUE_ID != '' && vars.MFL_FRANCHISE_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out data and previous game-day state
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --requirement requirements.txt
      - name: Validate official NFL status and notification logic
        run: |
          python -m unittest discover -s tests -p 'test_pregame_news.py' -v
          python -m unittest discover -s tests -p 'test_nfl_game_day.py' -v
          python -m unittest discover -s tests -p 'test_email_design.py' -v
      - name: Check NFL inactive lists and independent NFL/RotoWire pregame news
        env:
          MFL_API_KEY: ${{ secrets.MFL_API_KEY }}
          MFL_LEAGUE_ID: ${{ vars.MFL_LEAGUE_ID }}
          MFL_FRANCHISE_ID: ${{ vars.MFL_FRANCHISE_ID }}
          MFL_SEASON: ${{ vars.MFL_SEASON }}
        run: python -m src.nfl_game_day prepare
      - name: Save confirmed statuses and fixed email payload before sending
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          # Don't overwrite a newer game-day file written after checkout.
          # The next scheduled check will reconcile from that latest version.
          if ! git diff --quiet HEAD origin/main -- site/data/game-day.json; then
            echo "Newer official game-day state already exists; skip stale write and send."
            echo "NFL_GAME_DAY_SKIP_SEND=1" >> "$GITHUB_ENV"
            git reset --hard origin/main
          else
            git add site/data/game-day.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m 'Update official NFL game-day availability [skip ci]'
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "NFL_GAME_DAY_SKIP_SEND=1" >> "$GITHUB_ENV"
                git reset --hard origin/main
              elif ! git push origin HEAD:main; then
                echo "Concurrent update; skip stale notification and retry on next check."
                echo "NFL_GAME_DAY_SKIP_SEND=1" >> "$GITHUB_ENV"
                git fetch origin main
                git reset --hard origin/main
              fi
            fi
          fi
      - name: Email newly confirmed game-day availability
        if: ${{ env.NFL_GAME_DAY_SKIP_SEND != '1' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          ALERT_TO: ${{ vars.ALERT_TO }}
        run: python -m src.nfl_game_day send
      - name: Persist accepted email notification
        if: ${{ env.NFL_GAME_DAY_SKIP_SEND != '1' }}
        run: |
          git add site/data/game-day.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record accepted NFL game-day notification [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Record game-day email in Event log
        if: ${{ env.NFL_GAME_DAY_SKIP_SEND != '1' }}
        env:
          AUDIT_GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.nfl_game_day audit

  deploy:
    needs: monitor
    if: ${{ needs.monitor.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out updated public report
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Ensure confirmed published report exists
        run: test -s site/data/report.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Publish game-day status dashboard
        id: deployment
        uses: actions/deploy-pages@v4
