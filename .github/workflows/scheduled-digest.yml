name: Scheduled Injury Email Delivery
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/digest_delivery.py'
      - 'src/email_design.py'
      - 'src/notify.py'
      - 'tests/test_digest_delivery.py'
      - '.github/workflows/scheduled-digest.yml'
  schedule:
    # Saskatchewan time is UTC-6 year-round.
    # Sunday delivery from 10:30 AM with frequent same-day retries.
    - cron: '30,45 16 * * 0'
    - cron: '0,15,30,45 17 * * 0'
    - cron: '7,37 18-23 * * 0'
    # Recovery after a missed Sunday delivery, until Monday at 6 PM SK.
    - cron: '17 0-23/2 * * 1'
    # Thursday delivery from 5 PM SK with frequent early retries.
    - cron: '0,15,30,45 23 * * 4'
    - cron: '7,37 0-5 * * 5'
    # Recovery after a missed Thursday delivery, until Friday at 6 PM SK.
    - cron: '17 6-23/2 * * 5'

permissions:
  contents: write

concurrency:
  group: injury-watch-scheduled-digest
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out delivery ledger and last verified injury report
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Test independent digest schedule and retry protection
        run: |
          python -m unittest discover -s tests -p 'test_digest_delivery.py' -v
          python -m unittest discover -s tests -p 'test_email_design.py' -v
      - name: Prepare and durably snapshot any due email
        env:
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          ALERT_TO: ${{ vars.ALERT_TO }}
        run: python -m src.digest_delivery prepare
      - name: Commit prepared digest before contacting email provider
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/digest-delivery.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare reliable injury email digest [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Deliver due digest with Resend idempotency key
        env:
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          ALERT_TO: ${{ vars.ALERT_TO }}
        run: python -m src.digest_delivery send
      - name: Persist provider acceptance before logging event
        run: |
          git add site/data/digest-delivery.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record accepted injury email digest [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Log successfully accepted scheduled email
        env:
          AUDIT_GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.digest_delivery audit
